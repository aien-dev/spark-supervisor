name: Sovereign CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build (seeded omc) and unprivileged tests
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout omega-mv at the pinned compiler
        uses: actions/checkout@v4
        with:
          repository: aien-dev/omega-mv
          ref: 0d6af54f995ffda3a4a07e06da8cd5e343f647f9
          path: omega-mv

      - name: Build
        run: OMC=omega-mv/seed/out/omc sh tools/build.sh

      - name: Syscall table matches systemd-analyze and kernel headers
        run: sh tools/gen-syscalls.sh --check

      - name: Unprivileged supervisor tests
        run: sh tests/user.sh
